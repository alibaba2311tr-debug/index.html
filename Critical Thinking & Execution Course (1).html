{k:"Critical Thinking & Execution",g:"THINK",h:"Think before you believe.",t:["A silent 10-minute course. Read at your own pace, pause anytime, then see what you can do.",`<small>© ${CFG.ISSUER}. All rights reserved. Please do not copy or redistribute.</small>`],d:25},
{k:"01 — The idea",g:"WHY",h:"Slow down for three seconds.",t:["Critical thinking isn't doubting everything. It's asking <b>better questions</b> before you decide what to believe or do.","Execution is the other half: turning a good decision into a <b>first small step</b>."],d:35},
{k:"02 — Facts & assumptions",g:"FACT",h:"What's known, and what's assumed?",t:["A <b>fact</b> can be checked. An <b>opinion</b> is a judgment. An <b>assumption</b> is something you rely on without checking.","The key question: <b>what would have to be true for this to work?</b>"],d:40},
{k:"Scenario",g:"ASSUME",h:"What would you do?",sc:{q:`Priya's exam starts at 7:30. She plans to leave at 7:00 and says, "I'll make it." Name two things that must be true for her plan to work.`,a:"The bus is on time. The trip really takes 30 minutes or less. She finds the room quickly. Once you see the assumptions, you can protect against them: leave at 6:45."},d:55},
{k:"03 — Evidence",g:"PROOF",h:"Claims are cheap. Evidence isn't.",t:["Ask <b>who says so</b>, <b>how they know</b>, and <b>what else could explain it</b>.","Ice cream sales and sunburns rise together. Hot weather causes both. <b>Correlation isn't causation.</b>"],d:40},
{k:"Scenario",g:"EVIDENCE",h:"What would you ask?",sc:{q:`An ad says: "9 out of 10 people felt more focused after FocusFizz!" What do you want to know before believing it?`,a:"Nine out of ten who? Compared to what: would water do the same? Was focus measured, or just self-reported? Who ran and paid for the survey? Not proven is not the same as false."},d:55},
{k:"04 — Weak arguments",g:"LOGIC",h:"Does the conclusion follow?",t:["Watch for <b>attacking the person</b>, <b>false choices</b> (only two options), <b>popularity</b> (everyone does it) and <b>jumping to conclusions</b>.",`The trap: "If it rains, the match is cancelled. It was cancelled, so it rained." Other causes exist.`],d:40},
{k:"05 — Bias",g:"BIAS",h:"Your brain takes shortcuts.",t:["<b>Confirmation</b>: you notice what agrees with you. <b>Anchoring</b>: the first number sticks. <b>Availability</b>: vivid feels common. <b>Sunk cost</b>: you stay because you've already invested.","Counter-move: <b>look for the best case against your own view</b>."],d:35},
{k:"Scenario",g:"SUNK",h:"What would you do?",sc:{q:`You've watched four episodes of a show you dislike. A friend says: "Finish it, you've put in so much time." What do you do?`,a:"The four hours are gone either way. The only useful question: would I choose to spend the next hour on this? Past cost shouldn't steer future choices."},d:40},
{k:"06 — Decisions",g:"CHOOSE",h:"Decide on purpose.",t:["List real <b>options</b>, not just the first one. Pick <b>criteria</b>: cost, time, risk, regret. Compare, and name the <b>trade-off</b>.","Easy to undo? <b>Move fast.</b> Hard to undo? <b>Slow down.</b>"],d:45},
{k:"07 — Breaking it down",g:"SPLIT",h:"Big problems are small problems in disguise.",t:[`Define it specifically. Not "we're bad at teamwork" but "we missed 3 of 4 deadlines and tasks had no owner."`,"Then split it into <b>pieces</b> finishable in an hour or less, each with an <b>owner</b> and a <b>date</b>."],d:40},
{k:"08 — Execution",g:"DO",h:"Thinking has a deadline.",t:["Overthinking feels like progress. It isn't. <b>Time-box</b> your planning, then do the <b>smallest next step</b>.","A <b>good-enough plan today</b> beats a perfect plan never. Act, check what happened, adjust."],d:40},
{k:"Scenario",g:"ACT",h:"What would you do?",sc:{q:"Your team has two weeks for a project and hasn't started. Everyone is debating the perfect approach. What do you do in the next hour?",a:"Stop debating. State the goal in one sentence, split the work into tasks, assign owners and dates, and start the smallest task today. Schedule a midpoint review."},d:40},
{k:"The process",g:"THINK",h:"Think. Decide. Do. Review.",t:["<b>T</b>arget the claim · <b>H</b>unt assumptions · <b>I</b>nspect evidence · <b>N</b>otice weak logic & bias · <b>K</b>now your decision. Then <b>execute</b>.","The assessment uses new situations. Apply the process; don't try to recall the examples."],d:45},
{k:"Finished",g:"DONE",h:"Course complete.",t:["Next: 10 multiple-choice and 5 written questions. 100 marks, no timer."],d:25}];

{c:"CT",q:`A manager says: "Sales dropped after we changed our logo, so the new logo hurt sales." What is the biggest weakness in this reasoning?`,o:[`Sales falling after the change doesn't show the logo caused it; the season, rivals or prices may have changed too.`,`Logos never affect sales.`,`The sales figures were probably recorded wrongly.`,`The manager isn't a trained designer.`]},
{c:"CT",q:`Leo says: "The map says 20 minutes, so if I leave at 3:00 I'll be there at 3:20." Which hidden assumption is Leo making?`,o:[`The trip will go exactly as estimated: no delays and no extra time to park or walk.`,`The map is probably wrong.`,`Leo wants to arrive late.`,`3:20 is a bad time to arrive.`]},

{c:"RE",q:`"If it rains, the match is cancelled. The match was cancelled. So it rained." Is this reasoning sound?`,o:[`No: a match can be cancelled for other reasons, so cancellation doesn't prove rain.`,`Yes, because the match was cancelled.`,`Yes, if it rained heavily.`,`No, because rain never cancels matches.`]},
